# Anywhy Flake — central dongle
CONFIG_PINCTRL=y

# Display
CONFIG_ZMK_DISPLAY=y

# Two peripherals (left + right halves)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Battery: the dongle has no battery of its own, so battery reporting is
# not implied by ZMK_BLE here. The dongle_display widget links against
# these symbols, so they must be enabled explicitly.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_BT_BAS=n

# BLE
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# ==================== DYA Studio ====================
# Requires cormoran's ZMK fork + modules — see config/west.yml.
# Connect the dongle over USB and open https://studio.dya.cormoran.works/
# in a WebUSB-capable browser (Chrome / Edge).
#
# IMPORTANT: &studio_unlock must be bound somewhere in the keymap or the
# app cannot connect. It is on the Nav and system layers here.

# === Studio ===
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# === Runtime Input Processor ===
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# === Settings RPC ===
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# === Runtime Sensor Rotate ===
# Deliberately OFF: this board has no encoder (no zmk,keymap-sensors node),
# so there is no sensor for the runtime-rotate behaviour to configure.
# CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
# CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# === Settings persistence ===
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# === Battery History (off, matching the reference config) ===
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n

# === Split ===
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024

# === Power management ===
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
