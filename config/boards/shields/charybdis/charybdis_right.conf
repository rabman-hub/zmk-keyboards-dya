CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_EXT_POWER=y

# PMW3610 trackball — badjeff/zmk-pmw3610-driver (split-peripheral capable)
# badjeff renamed every Kconfig symbol to the PMW3610_ALT_* prefix.
# Without this the driver is not compiled in at all, and the link fails
# with "undefined reference to `__device_dts_ord_NN'" from input_split.c,
# because no device struct is ever created for the trackball node.
CONFIG_PMW3610_ALT=y

# Troubleshooting (from badjeff's README): if the log shows
#   "Incorrect product id 0xFF (expecting 0x3E)!"
# on a nice_nano_v2, the sensor needs longer to come up after power-on:
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Deprecated in favour of devicetree properties (already set in
# charybdis-trackball.dtsi): PMW3610_ALT_SWAP_XY, _INVERT_X, _INVERT_Y

# Tuning moved into devicetree in badjeff's fork — see
# charybdis-trackball.dtsi:
#   CONFIG_PMW3610_CPI=2400        -> cpi = <2400>;
#   CONFIG_PMW3610_ORIENTATION_90  -> swap-xy; invert-x;
#   CONFIG_PMW3610_INVERT_X        -> invert-x;
#
# Dropped entirely (driver no longer implements them; DYA Studio owns
# scroll/snipe/auto-mouse via &mouse_runtime_input_processor):
#   CONFIG_PMW3610_SNIPE_CPI / _DIVIDOR
#   CONFIG_PMW3610_SCROLL_TICK
#   CONFIG_PMW3610_CPI_DIVIDOR
