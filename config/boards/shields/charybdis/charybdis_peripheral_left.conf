# Charybdis — left peripheral (dongle setup)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ==================== DYA Studio (peripheral) ====================
# Lets the dongle relay settings/battery data for this half.
CONFIG_ZMK_BATTERY_HISTORY=n
# CONFIG_ZMK_BATTERY_HISTORY_INTERVAL_MINUTES=30  # only valid when BATTERY_HISTORY=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# === Power management ===
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
