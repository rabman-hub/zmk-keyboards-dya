# Charybdis (PMW3610 trackball) — user config
# Migrated from petejohanson/zmk feat/pointers-move-scroll to mainline ZMK.

# Mouse / pointing (was CONFIG_ZMK_MOUSE on the old fork)
CONFIG_ZMK_POINTING=y

# BLE connection-stability tweaks
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery report interval (seconds)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Key debounce (ms)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_KEYBOARD_NAME="Chary"

# Sleep — disabled (display-wake issue noted by the original author)
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
